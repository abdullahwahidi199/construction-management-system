  /api/attendance/:
    get:
      tags:
      - Attendance
      summary: list AttendanceViewSet
      description: "Attendance management.\n\nlist:    GET /attendance/          \
        \    — all records (with filters)\ncreate:  POST /attendance/            \
        \ — single record\nread:    GET /attendance/{id}/         — one record\nupdate:\
        \  PUT /attendance/{id}/         — full update\npatch:   PATCH /attendance/{id}/\
        \       — partial update\ndelete:  DELETE /attendance/{id}/      — remove\
        \ record\n\nCustom actions:\n    POST /attendance/bulk_mark/       — mark\
        \ attendance for many employees at once\n    GET  /attendance/daily/?date=\
        \     — get all attendance for a specific date\n    GET  /attendance/summary/?employee=&month=&year=\
        \ — monthly summary"
      parameters: []
      security:
      - TokenAuth: []
      x-required-permissions:
      - attendance.view
      - attendance.view_assigned
      x-roles:
      - admin
      - data_entry
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceListSerializer'
        '400':
          description: Validation error
        '401':
          description: Authentication required
        '403':
          description: Permission denied
        '404':
          description: Not found
